<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><title>Site Sequence</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js" defer></script>
<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Site Sequence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#F1EFE7; --surface:#FBFAF5; --surface-2:#EFEBDF;
    --ink:#221F1A; --ink-dim:#655F52; --ink-faint:#8C8676;
    --border:#DAD4C4; --border-strong:#C2BAA4;
    --accent:#2B5D63; --accent-ink:#FFFFFF; --accent-soft:#DEEAEA; --accent-soft-ink:#1D4145;
    --good:#3E7D4E; --good-soft:#E1EFE3;
    --warning:#9A6B0C; --warning-soft:#F3E7CB;
    --critical:#AE3B2E; --critical-soft:#F5E0DB;
    --shadow: 0 1px 2px rgba(30,26,18,.06), 0 4px 14px rgba(30,26,18,.05);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#17191A; --surface:#1E2122; --surface-2:#26292A;
      --ink:#ECE8DE; --ink-dim:#A79F8E; --ink-faint:#7C7568;
      --border:#34383A; --border-strong:#454A4C;
      --accent:#6FB9BE; --accent-ink:#0E2224; --accent-soft:#213638; --accent-soft-ink:#9FD8DC;
      --good:#74C98A; --good-soft:#1B3324;
      --warning:#E3B24A; --warning-soft:#3A2E12;
      --critical:#E48577; --critical-soft:#3B211D;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#17191A; --surface:#1E2122; --surface-2:#26292A;
    --ink:#ECE8DE; --ink-dim:#A79F8E; --ink-faint:#7C7568;
    --border:#34383A; --border-strong:#454A4C;
    --accent:#6FB9BE; --accent-ink:#0E2224; --accent-soft:#213638; --accent-soft-ink:#9FD8DC;
    --good:#74C98A; --good-soft:#1B3324;
    --warning:#E3B24A; --warning-soft:#3A2E12;
    --critical:#E48577; --critical-soft:#3B211D;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',system-ui,sans-serif;font-size:14.5px;line-height:1.5;}
  h1,h2,h3{font-family:'Archivo',system-ui,sans-serif;text-wrap:balance;margin:0;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}
  button, select, input, textarea{font:inherit;color:inherit;}
  button{cursor:pointer;}

  #shell{display:flex;min-height:100vh;}
  #rail{width:200px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:22px;}
  #rail .brand{display:flex;align-items:baseline;gap:8px;padding:0 4px;}
  #rail .brand .mark{font-family:'Archivo';font-weight:900;font-size:20px;letter-spacing:-.02em;}
  #rail .brand .tag{font-family:'IBM Plex Mono';font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;}
  #rail nav{display:flex;flex-direction:column;gap:2px;}
  #rail nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-dim);text-decoration:none;font-weight:600;font-size:13.5px;}
  #rail nav a.active{background:var(--accent-soft);color:var(--accent-soft-ink);}
  #rail nav a:hover:not(.active){background:var(--surface-2);}
  #rail .foot{margin-top:auto;font-size:11px;color:var(--ink-faint);padding:0 4px;}

  #main{flex:1;min-width:0;padding:28px 34px 60px;}
  .pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .pagehead h1{font-size:26px;font-weight:900;}
  .pagehead p{margin:4px 0 0;color:var(--ink-dim);max-width:52ch;}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:9px 15px;border-radius:8px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{filter:brightness(1.06);}
  .btn.secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);}
  .btn.ghost{background:transparent;color:var(--accent);padding:9px 4px;}
  .btn.small{padding:5px 10px;font-size:12px;border-radius:6px;}
  .btn.danger{background:var(--critical-soft);color:var(--critical);}

  .banner{display:flex;gap:10px;align-items:flex-start;background:var(--warning-soft);color:var(--warning);border:1px solid color-mix(in srgb, var(--warning) 35%, transparent);border-radius:var(--radius);padding:11px 14px;margin-bottom:18px;font-size:13px;}
  .banner strong{color:inherit;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  .grid-jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;}
  .jobcard{padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .08s ease;}
  .jobcard:hover{border-color:var(--border-strong);}
  .jobcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .jobcode{font-family:'Archivo';font-weight:900;font-size:19px;letter-spacing:-0.01em;}
  .jobdesc{color:var(--ink-dim);font-size:12.5px;margin-top:1px;}
  .jobclient{color:var(--ink-faint);font-size:11.5px;margin-top:3px;font-style:italic;}
  .jobclientline{color:var(--ink-faint);font-size:12px;margin:-6px 0 14px;font-style:italic;}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap;}
  .pill.good{background:var(--good-soft);color:var(--good);}
  .pill.warn{background:var(--warning-soft);color:var(--warning);}
  .pill.crit{background:var(--critical-soft);color:var(--critical);}
  .pill.neutral{background:var(--surface-2);color:var(--ink-dim);}
  .jobstats{display:flex;gap:16px;border-top:1px solid var(--border);padding-top:10px;}
  .jobstats .stat b{display:block;font-family:'IBM Plex Mono';font-size:15px;font-variant-numeric:tabular-nums;}
  .jobstats .stat span{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;}

  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);text-decoration:none;font-size:12.5px;font-weight:600;margin-bottom:14px;}
  .jobheader{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px;}
  .jobheader .idbox{display:flex;align-items:baseline;gap:12px;}
  .summarybar{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;}
  .summarybar .cell{flex:1;padding:12px 16px;border-right:1px solid var(--border);background:var(--surface);}
  .summarybar .cell:last-child{border-right:none;}
  .summarybar .cell span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:3px;}
  .summarybar .cell b{font-family:'IBM Plex Mono';font-size:17px;}

  table.tasks{width:100%;border-collapse:collapse;font-size:13px;}
  table.tasks th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);padding:8px 10px;border-bottom:1px solid var(--border-strong);}
  table.tasks td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  table.tasks tr.critical td{background:color-mix(in srgb, var(--critical-soft) 55%, transparent);}
  .taskname{font-weight:600;}
  .tasknote{color:var(--ink-faint);font-size:11.5px;margin-top:2px;}
  .badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
  .badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em;}
  .badge.crit{background:var(--critical);color:#fff;}
  .badge.near{background:var(--warning-soft);color:var(--warning);}
  .badge.sub{background:var(--surface-2);color:var(--ink-dim);border:1px solid var(--border-strong);}
  .badge.spec{background:var(--accent-soft);color:var(--accent-soft-ink);}
  .badge.gen{background:var(--warning-soft);color:var(--warning);}

  .timebox{margin-top:26px;}
  .timebox h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:10px;}
  .time-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .time-summary .chip{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-width:84px;}
  .time-summary .chip span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:2px;}
  .time-summary .chip b{font-family:'IBM Plex Mono';font-size:15px;font-variant-numeric:tabular-nums;}
  form.timeform{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:12px;}
  form.timeform .timeform-top{display:flex;align-items:flex-end;gap:8px;margin-bottom:10px;}
  form.timeform .timeform-top label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--ink-dim);font-weight:600;}
  form.timeform .timeform-top input{background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;padding:7px 9px;font-size:13px;}
  .timepick{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .timepick-row{display:flex;align-items:center;gap:10px;}
  .timepick-row label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;flex:1;}
  .timepick-row input[type=number]{width:64px;background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;padding:5px 7px;font-size:13px;}
  .timepick-row.disabled label{color:var(--ink-faint);font-weight:500;}
  table.timelist{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;}
  table.timelist th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);padding:6px 8px;border-bottom:1px solid var(--border-strong);}
  table.timelist th.num, table.timelist td.num{text-align:right;}
  table.timelist td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
  table.timelist td.timedate{color:var(--ink-faint);white-space:nowrap;}
  .spendbox{margin-top:26px;}
  .spendbox h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:10px;}
  .spend-budgetbar{display:flex;gap:0;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;margin-bottom:14px;}
  .spend-budgetbar .cell{flex:1;padding:10px 14px;border-right:1px solid var(--border);background:var(--surface);}
  .spend-budgetbar .cell:last-child{border-right:none;}
  .spend-budgetbar .cell span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:3px;}
  .spend-budgetbar .cell b{font-family:'IBM Plex Mono';font-size:16px;font-variant-numeric:tabular-nums;}
  .spend-budgetbar .cell.over b{color:var(--critical);}
  .spend-budgetbar .cell.under b{color:var(--ok, #2a9d5c);}
  form.spendform{display:grid;grid-template-columns:1fr 130px 150px auto;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:12px;align-items:end;}
  form.spendform label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--ink-dim);font-weight:600;}
  form.spendform input{background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;padding:7px 9px;font-size:13px;}
  table.spendlist{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;}
  table.spendlist th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);padding:6px 8px;border-bottom:1px solid var(--border-strong);}
  table.spendlist th.num, table.spendlist td.num{text-align:right;}
  table.spendlist td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
  table.spendlist td.spenddate{color:var(--ink-faint);white-space:nowrap;}

  .quotebox{margin-top:26px;}
  .quotebox h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:10px;display:flex;align-items:center;gap:10px;}
  .quotebox h3 .quotemeta{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-dim);font-size:12px;}
  table.quoteitems{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;}
  table.quoteitems th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);padding:7px 8px;border-bottom:1px solid var(--border-strong);}
  table.quoteitems th.num, table.quoteitems td.num{text-align:right;}
  table.quoteitems td{padding:6px 8px;border-bottom:1px solid var(--border);}
  table.quoteitems tr.sectionrow td{padding-top:14px;padding-bottom:4px;border-bottom:none;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);}
  table.quoteitems tr.sectionrow:first-child td{padding-top:6px;}
  table.quoteitems tr.totalrow td{border-bottom:none;border-top:2px solid var(--border-strong);font-weight:700;padding-top:9px;}
  .quotenote{color:var(--ink-faint);font-style:italic;font-size:11px;}

  .timeline{margin-top:22px;}
  .tl-row{display:grid;grid-template-columns:180px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);}
  .tl-row .lbl{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tl-track{position:relative;height:16px;background:var(--surface-2);border-radius:5px;}
  .tl-bar{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--accent);}
  .tl-bar.critical{background:var(--critical);}
  .tl-grid{position:relative;height:14px;margin:2px 0 8px 190px;border-bottom:1px dashed var(--border-strong);}

  form.taskform{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:18px;}
  form.taskform .full{grid-column:1/-1;}
  form.taskform label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-dim);font-weight:600;}
  form.taskform input, form.taskform select, form.taskform textarea{background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;padding:7px 9px;font-size:13px;}
  form.taskform .actions{grid-column:1/-1;display:flex;gap:8px;margin-top:4px;}
  .crewpick{display:flex;flex-wrap:wrap;gap:6px;}
  .crewpick label{flex-direction:row;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border-strong);padding:5px 9px;border-radius:99px;font-weight:500;}
  .crewpick.small{gap:4px;}
  .crewpick.small label{padding:3px 7px;font-size:11px;}

  .joblist-group{margin-bottom:22px;}
  .joblist-heading{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .joblist-count{font-size:11px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:99px;padding:1px 8px;color:var(--ink-dim);font-weight:600;}

  .settings-section{margin-bottom:26px;}
  .settings-section h2{font-size:16px;margin-bottom:10px;}
  .rate-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:6px;}
  .rate-table th{text-align:left;font-size:10px;text-transform:uppercase;color:var(--ink-faint);padding:6px 8px;border-bottom:1px solid var(--border-strong);}
  .rate-table td{padding:5px 8px;border-bottom:1px solid var(--border);}
  .rate-table input{width:100%;background:var(--surface);border:1px solid var(--border-strong);border-radius:5px;padding:4px 6px;font-size:12.5px;}
  .crewlist{display:flex;flex-direction:column;gap:10px;}
  .crewblock{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;}
  .crewrow{display:flex;gap:10px;align-items:center;}
  .crewrow input[type=text]{background:transparent;border:none;border-bottom:1px solid var(--border-strong);padding:2px 2px;font-weight:600;}
  .crewnotes{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
  .crewnote-chip{font-size:11px;background:var(--surface-2);border-radius:6px;padding:3px 8px;color:var(--ink-dim);}
  .crewnote-chip .x{cursor:pointer;color:var(--ink-faint);margin-left:5px;font-weight:700;}
  form.crewnoteform{display:flex;align-items:center;gap:6px;margin-left:auto;}
  form.crewnoteform input[type=date]{font-size:11px;padding:3px 6px;border-radius:5px;border:1px solid var(--border-strong);background:var(--surface-2);}
  form.crewnoteform input[type=text]{font-size:11px;padding:3px 6px;border-radius:5px;border:1px solid var(--border-strong);background:var(--surface-2);width:150px;}
  form.crewnoteform button{font-size:11px;padding:3px 8px;}
  .tagcloud{display:flex;gap:4px;flex-wrap:wrap;flex:1;}
  .tagchip{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface-2);cursor:pointer;}
  .tagchip.on{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:transparent;}

  .empty{padding:40px 20px;text-align:center;color:var(--ink-faint);}
  .demo-banner{background:var(--accent-soft);color:var(--accent-soft-ink);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;font-size:12.5px;}

  .riskblock{padding:14px 16px;margin-top:20px;border-color:var(--critical);}
  .riskhead{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--critical);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
  .riskgroups{display:flex;flex-direction:column;gap:10px;}
  .riskgroup{display:flex;gap:12px;}
  .riskgroup-code{flex:0 0 auto;min-width:76px;font-weight:700;font-size:12.5px;padding-top:1px;}
  .riskgroup-lines{display:flex;flex-direction:column;gap:4px;flex:1;}
  .riskrow{display:flex;align-items:baseline;gap:8px;font-size:13px;}
  .riskdot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;transform:translateY(-1px);}
  .dot-critical{background:var(--critical);}
  .dot-warn{background:var(--warning);}
  .risktext{color:var(--ink-dim);}
  .risktoggle{background:none;border:none;color:var(--ink-dim);font-size:11.5px;font-weight:600;cursor:pointer;text-decoration:underline;padding:0;}

  .ganttcard{margin-bottom:20px;padding:16px 18px;}
  .ganttcard h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:2px;}
  .gantt-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-faint);margin:2px 0 8px 130px;}
  .gantt-rows{display:flex;flex-direction:column;gap:14px;}
  .gantt-group{display:flex;flex-direction:column;gap:5px;}
  .gantt-group-heading{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);display:flex;align-items:center;gap:6px;}
  .gantt-row{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;cursor:pointer;}
  .gantt-row .lbl{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .gantt-row .lbl small{display:block;font-weight:500;color:var(--ink-faint);font-size:10.5px;}
  .gantt-track{position:relative;height:18px;background:var(--surface-2);border-radius:5px;}
  .gantt-bar{position:absolute;top:0;bottom:0;border-radius:5px;min-width:6px;display:flex;align-items:center;justify-content:center;overflow:visible;}
  .gantt-bar-label{font-size:9.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none;}
  .gantt-bar-label.in{color:#fff;mix-blend-mode:normal;}
  .gantt-bar-label.out{position:absolute;top:50%;transform:translateY(-50%);margin-left:5px;color:var(--ink-faint);}
  .gantt-bar.bar-crit{background:var(--critical);}
  .gantt-bar.bar-warn{background:var(--warning);}
  .gantt-bar.bar-good{background:var(--accent);}
  .gantt-bar.bar-neutral{background:var(--ink-faint);}

  // Local-calendar-day formatter. Deliberately NOT toISOString().slice(0,10) — that
  // converts through UTC, and in a timezone ahead of UTC (e.g. Africa/Johannesburg,
  // UTC+2) a local midnight Date lands at 22:00 the previous day in UTC, silently
  // shifting every calendar date back by one day (a Monday finish gets labelled
  // Sunday). Using the Date object's own local year/month/day keeps the label
  // matching the same local day used for day-of-week checks.
  function localISODate(d){
    const dt = d || new Date();
    const y = dt.getFullYear();
    const m = String(dt.getMonth()+1).padStart(2,'0');
    const day = String(dt.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  // safe default. Saturday catch-up only ever applies to a job explicitly flagged

  function jobAllowsWeekendCatchUp(job){
    const isEstate = job.isEstateJob !== false;
    return !isEstate && !!job.saturdayCatchUp;

  const DataAccess = (function(){

          if (typeof firebase === 'undefined' || !FIREBASE_CONFIGURED){ resolve(null); return; }
          try{
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            resolve(firebase.firestore());
          }catch(err){ console.error('Firebase init error', err); resolve(null); }

    async function maybeImportSeedData(){

      if (!db || typeof SEED_DATA === 'undefined') return;
      try{
        const existing = await db.collection('jobs').limit(1).get();
        if (!existing.empty) return;
        const batch = db.batch();
        Object.entries(SEED_DATA.settings||{}).forEach(([id, data])=>{ batch.set(db.doc('settings/'+id), data); });
        Object.entries(SEED_DATA.crew||{}).forEach(([id, data])=>{ batch.set(db.doc('crew/'+id), data); });

  /* =========================================================
     SECTION: Scheduler — pure functions, no db references
     ========================================================= */
  const Scheduler = (function(){

    function resolveMultiplier(task, catDef){
      if (task.multiplierOverride != null && task.multiplierOverride !== "") return Number(task.multiplierOverride);
      const st = catDef && catDef.subTypes && catDef.subTypes[task.subType];
      return st ? st.multiplier : 1.0;
    }

    function effortPersonDays(task, catDef){
      const mult = resolveMultiplier(task, catDef);
      const qty = Number(task.quantity)||0;
      switch(task.calcType){
        case "area": return catDef.baseRatePerDay ? (qty / catDef.baseRatePerDay) * mult : 0;
        case "unit": return (catDef.timePerUnitDays||0) * qty * mult;
        case "block": return (catDef.blockDaysByTier && catDef.blockDaysByTier[task.blockSizeTier]) || 1;
        case "fixed": return null;
        default: return 0;
      }
    }

    function crewEfficiencyMultiplier(task, catDef, crewById, crewRules){
      const ids = task.crewIds||[];
      const n = ids.length || 1;
      const group = (catDef && catDef.groupForEfficiency) || "open";
      const curve = (crewRules.efficiencyCurves && crewRules.efficiencyCurves[group]) || {1:1,2:1,3:1};
      const groupMult = curve[Math.min(n,3)] != null ? curve[Math.min(n,3)] : 1;
      if (ids.length === 0) return 1;
      let weight = 0;
      ids.forEach(id=>{
        const m = crewById[id];
        const matches = m && Array.isArray(m.tradeTags) && m.tradeTags.includes(task.category);
        weight += matches ? 1 : (crewRules.generalistPenalty != null ? crewRules.generalistPenalty : 0.8);
      });
      return groupMult * (weight / n);
    }

    function taskDurationDays(task, catDef, crewById, crewRules){
      if (task.durationOverrideDays != null && task.durationOverrideDays !== ""){
        return Number(task.durationOverrideDays);
      }
      const effort = effortPersonDays(task, catDef||{});
      if (effort == null) return 1; // fixed task with no override entered yet — default 1 day placeholder
      const eff = crewEfficiencyMultiplier(task, catDef||{}, crewById, crewRules);
      return effort / (eff || 1);
    }

    function isoDate(d){ return localISODate(d); }

    function buildWorkingCalendar(startDateStr, neededWorkingDays, calSettings, saturdayCatchUp){
      const workingDaysSet = new Set(calSettings.workingDays || [1,2,3,4,5]);
      const holidays = new Set(calSettings.holidays || []);
      const dates = [];
      let d = new Date((startDateStr||isoDate(new Date())) + "T00:00:00");
      let guard = 0;
      const need = Math.max(10, neededWorkingDays + 5);
      while (dates.length < need && guard < 8000){
        guard++;
        const dow = d.getDay();
        const iso = isoDate(d);
        const isWorking = workingDaysSet.has(dow) || (saturdayCatchUp && dow === 6);
        if (isWorking && !holidays.has(iso)) dates.push(iso);
        d = new Date(d.getTime() + 86400000);
      }
      return dates;
    }

    function dayOffsetToDate(offsetDays, calendarDates, isCompletion){
      if (offsetDays == null || !calendarDates.length) return null;
      const idx = isCompletion ? Math.max(0, Math.ceil(offsetDays) - 1) : Math.floor(offsetDays);
      return calendarDates[Math.min(idx, calendarDates.length - 1)];
    }

    function computeSchedule(tasks, crewById, settings, jobStartDateStr, saturdayCatchUp){
      if (!tasks.length){
        return { perTask:{}, projectFinishDays:0, completionDate:jobStartDateStr, criticalTaskIds:[], bottleneckTaskIds:[] };
      }
      const rates = settings.rates || DEFAULT_RATES;
      const crewRules = settings.crewRules || DEFAULT_CREW_RULES;
      const byId = {}; tasks.forEach(t=>byId[t.id]=t);

      tasks.forEach(t=>{ t._dur = Math.max(0.01, taskDurationDays(t, rates.categories[t.category], crewById, crewRules)); });

      const indegCopy = {}; tasks.forEach(t=>indegCopy[t.id]=0);
      const successors = {}; tasks.forEach(t=>successors[t.id]=[]);
      tasks.forEach(t=>(t.dependsOn||[]).forEach(d=>{ if(byId[d]){ indegCopy[t.id]++; successors[d].push(t.id); } }));

      const queue = tasks.filter(t=>indegCopy[t.id]===0).map(t=>t.id);
      const topo = [];
      const q = queue.slice();
      while(q.length){ const id=q.shift(); topo.push(id); successors[id].forEach(s=>{ indegCopy[s]--; if(indegCopy[s]===0) q.push(s); }); }
      if (topo.length !== tasks.length){
        return { error:"cycle", message:"Task dependencies form a loop — fix before this job can be scheduled." };
      }

      topo.forEach(id=>{
        const t = byId[id]; const deps=(t.dependsOn||[]).filter(d=>byId[d]);
        t._ES = deps.length ? Math.max.apply(null, deps.map(d=>byId[d]._EF)) : 0;
        t._EF = t._ES + t._dur;
      });
      const projFinishUnconstrained = Math.max.apply(null, [0].concat(tasks.map(t=>t._EF)));
      topo.slice().reverse().forEach(id=>{
        const t = byId[id]; const succ = successors[id];
        t._LF = succ.length ? Math.min.apply(null, succ.map(s=>byId[s]._LS)) : projFinishUnconstrained;
        t._LS = t._LF - t._dur;
      });
      tasks.forEach(t=>{ t._slackUnconstrained = t._LS - t._ES; });

      const crewFreeAt = {};
      const RS={}, RF={};
      const remainingDeps = {}; tasks.forEach(t=>remainingDeps[t.id]=(t.dependsOn||[]).filter(d=>byId[d]).length);
      let eligible = tasks.filter(t=>remainingDeps[t.id]===0).map(t=>t.id);
      const scheduledOrder = [];
      while(eligible.length){
        eligible.sort((a,b)=>{
          const ta=byId[a], tb=byId[b];
          if (ta._slackUnconstrained !== tb._slackUnconstrained) return ta._slackUnconstrained - tb._slackUnconstrained;
          if (ta._ES !== tb._ES) return ta._ES - tb._ES;
          return (ta.order||0)-(tb.order||0);
        });
        const id = eligible.shift();
        const t = byId[id];
        const deps = (t.dependsOn||[]).filter(d=>byId[d]);
        const depReady = deps.length ? Math.max.apply(null, deps.map(d=>RF[d])) : 0;
        const crewIds = t.crewIds||[];
        const crewReady = crewIds.length ? Math.max.apply(null, crewIds.map(c=>crewFreeAt[c]||0)) : 0;
        const rs = Math.max(depReady, crewReady);
        const rf = rs + t._dur;
        RS[id]=rs; RF[id]=rf;
        crewIds.forEach(c=>{ crewFreeAt[c]=rf; });
        scheduledOrder.push(id);
        successors[id].forEach(s=>{ remainingDeps[s]--; if(remainingDeps[s]===0) eligible.push(s); });
      }
      const projectFinish = Math.max.apply(null, [0].concat(tasks.map(t=>RF[t.id])));

      const formalEdge = {}; tasks.forEach(t=>(t.dependsOn||[]).forEach(d=>{ if(byId[d]) formalEdge[d+'>'+t.id]=true; }));
      const implicitSucc = {}; tasks.forEach(t=>implicitSucc[t.id]=[]);
      const byCrew = {};
      tasks.forEach(t=>(t.crewIds||[]).forEach(c=>{ (byCrew[c]=byCrew[c]||[]).push(t.id); }));
      Object.keys(byCrew).forEach(c=>{
        const sorted = byCrew[c].slice().sort((a,b)=>RS[a]-RS[b]);
        for(let i=0;i<sorted.length-1;i++){
          const a=sorted[i], b=sorted[i+1];
          if (Math.abs(RF[a]-RS[b]) < 1e-6 && !formalEdge[a+'>'+b]) implicitSucc[a].push(b);
        }
      });
      const allSucc = {}; tasks.forEach(t=>{ allSucc[t.id] = successors[t.id].concat(implicitSucc[t.id]); });

      const LF={}, LS={}, slack={};
      scheduledOrder.slice().reverse().forEach(id=>{
        const succ = allSucc[id];
        LF[id] = succ.length ? Math.min.apply(null, succ.map(s=>LS[s])) : projectFinish;
        LS[id] = LF[id] - byId[id]._dur;
        slack[id] = LS[id] - RS[id];
      });

      const EPS = 0.01;
      const bottleneckThreshold = (crewRules.bottleneckSlackThresholdDays!=null) ? crewRules.bottleneckSlackThresholdDays : 1;
      const calendar = buildWorkingCalendar(jobStartDateStr, Math.ceil(projectFinish), settings.calendar||DEFAULT_CALENDAR, saturdayCatchUp);

      const perTask = {};
      tasks.forEach(t=>{
        const catDef = (rates.categories||{})[t.category] || {};
        const isSpecialist = catDef.groupForEfficiency === "specialist";
        const hasSub = (t.crewIds||[]).some(id=> crewById[id] && crewById[id].role === "subcontractor");
        const isGenPenalized = (t.crewIds||[]).some(id=>{
          const m = crewById[id];
          return m && Array.isArray(m.tradeTags) && !m.tradeTags.includes(t.category);
        });
        perTask[t.id] = {
          durationDays: t._dur, RS:RS[t.id], RF:RF[t.id], LS:LS[t.id], LF:LF[t.id], slack:slack[t.id],
          isCritical: slack[t.id] <= EPS,
          isNearCritical: slack[t.id] > EPS && slack[t.id] <= bottleneckThreshold,
          isSubcontractor: hasSub, isSpecialistSingleOperator: isSpecialist, isGeneralistPenalized: isGenPenalized,
          calendarStart: dayOffsetToDate(RS[t.id], calendar, false),
          calendarFinish: dayOffsetToDate(RF[t.id], calendar, true),
        };
      });

      return {
        perTask, projectFinishDays: projectFinish,
        completionDate: dayOffsetToDate(projectFinish, calendar, true),
        criticalTaskIds: tasks.filter(t=>perTask[t.id].isCritical).map(t=>t.id),
        bottleneckTaskIds: tasks.filter(t=>perTask[t.id].isNearCritical || perTask[t.id].isSubcontractor || perTask[t.id].isSpecialistSingleOperator).map(t=>t.id),
      };
    }

    return { taskDurationDays, computeSchedule, buildWorkingCalendar, dayOffsetToDate };
  })();

  /* =========================================================
     SECTION: Risks — cross-job bottleneck & double-booking scan
     ========================================================= */
  function computeRisksList(jobs, tasksByJobId, crewById, settings){
    const risks = [];
    const scheduleByJob = {};

    jobs.forEach(job=>{
      const tasks = tasksByJobId[job.id] || [];
      if (!tasks.length) return;
      const sched = Scheduler.computeSchedule(tasks, crewById, settings, job.startDate, jobAllowsWeekendCatchUp(job));
      if (sched.error){ risks.push({ code: job.code||'—', group: job.code||'—', text: 'Task dependency loop — fix in job', severity:'critical' }); return; }
      scheduleByJob[job.id] = { job, tasks, sched };
    });

    const today = localISODate();
    const NOTICE_WINDOW_DAYS = 10; // only surface "no crew yet" noise for jobs starting soon

    jobs.forEach(job=>{
      const status = job.status || '';
      if (/waiting|hold/i.test(status)){
        const short = status.replace(/^\S+\s*/,'').trim();
        risks.push({ code: job.code||'—', group: job.code||'—', text: short || 'Blocked', severity:'warn' });
      }
      if (job.isEstateJob !== false && job.saturdayCatchUp){
        risks.push({ code: job.code||'—', group: job.code||'—', text: 'Estate job with Saturday catch-up enabled — noise rules don\'t allow this', severity:'critical' });
      }
    });

    Object.values(scheduleByJob).forEach(({job, tasks, sched})=>{
      tasks.forEach(t=>{
        const p = sched.perTask[t.id];
        if (!p) return;
        if (!t.crewIds || !t.crewIds.length){
          const startsSoon = p.calendarStart && (new Date(p.calendarStart+'T00:00:00') - new Date(today+'T00:00:00')) <= NOTICE_WINDOW_DAYS*86400000;
          if (startsSoon){
            risks.push({ code: job.code||'—', group: job.code||'—', text: `${t.name} — no crew assigned`, severity:'warn' });
          }
        } else if (p.isSubcontractor && p.isCritical){
          risks.push({ code: job.code||'—', group: job.code||'—', text: `${t.name} — subcontractor on critical path`, severity:'critical' });
        }
      });
    });

    risks.sort((a,b)=> (a.severity==='critical'?0:1) - (b.severity==='critical'?0:1));
    return risks;
  }

      if(status.includes('🔴')||/delay/i.test(status)) return 'crit';

      const groups = {};
      risks.forEach(r=>{ const g = r.group||r.code||'—'; (groups[g]=groups[g]||[]).push(r); });
      const groupEntries = Object.entries(groups).map(([code, list])=>({
        code, list, hasCritical: list.some(r=>r.severity==='critical'),
      }));
      groupEntries.sort((a,b)=> (a.hasCritical===b.hasCritical) ? a.code.localeCompare(b.code) : (a.hasCritical?-1:1));

      const criticalGroups = groupEntries.filter(g=>g.hasCritical);
      const warnGroups = groupEntries.filter(g=>!g.hasCritical);
      const warnCount = warnGroups.reduce((s,g)=>s+g.list.length,0);

      const groupHtml = g => `<div class="riskgroup">
          <div class="riskgroup-code mono">${escapeHtml(g.code)}</div>
          <div class="riskgroup-lines">${renderRiskLines(g.list)}</div>
        </div>`;

        ? `<button class="risktoggle" data-action="toggle-risks">Show fewer</button>`

      maxFinish = Math.max(maxFinish, todayMs + 86400000);
      const span = Math.max(1, maxFinish - minStart);
      const todayPct = ((todayMs - minStart) / span * 100).toFixed(2);

      const ganttRow = (j) => {
        const start = toTime(j.startDate);

        const labelHtml = fitsInside
          ? `<span class="gantt-bar-label in">${daysLabel}</span>`

      const list = entries.length ? `<table class="timelist">
          <thead><tr><th>Date</th><th>Who</th><th class="num">Days</th><th></th></tr></thead>
          <tbody>${rows}</tbody></table>` : `<div class="empty" style="padding:8px 2px;">No time logged yet.</div>`;

      return `<div class="timebox card" style="padding:16px 18px;">
        <h3>Time on site</h3>
        ${summary}
        <form class="timeform" data-form="new-timeonsite">
          <div class="timeform-top">
            <label>Date<input type="date" name="date" value="${localISODate()}"></label>
          </div>
          <div class="timepick">${pickRows}</div>
          <button class="btn secondary" type="submit">+ Log</button>
        </form>
        ${list}
      </div>`;
    }

    function renderActualSpend(job){
      const entries = (job.actualSpend||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.addedAt||'').localeCompare(a.addedAt||''));
      const totalSpent = entries.reduce((sum,e)=>sum + (Number(e.amount)||0), 0);
      const totalQuoted = (job.quoteLineItems||[]).reduce((sum,it)=>sum + (Number(it.total)||0), 0);

      let budgetBar = '';
      if (totalQuoted){
        const remaining = totalQuoted - totalSpent;
        const cls = remaining < 0 ? 'over' : 'under';
        budgetBar = `<div class="spend-budgetbar">
          <div class="cell"><span>Quoted</span><b>${fmtR(totalQuoted)}</b></div>
          <div class="cell"><span>Spent so far</span><b>${fmtR(totalSpent)}</b></div>
          <div class="cell ${cls}"><span>${remaining<0?'Over by':'Remaining'}</span><b>${fmtR(Math.abs(remaining))}</b></div>
        </div>`;
      } else if (entries.length){
        budgetBar = `<div class="spend-budgetbar"><div class="cell"><span>Logged spend</span><b>${fmtR(totalSpent)}</b></div></div>`;
      }

      const rows = entries.map(e=>`<tr>
          <td class="spenddate mono">${fmtDate(e.date)}</td>
          <td>${escapeHtml(e.description)}</td>
          <td class="num mono">${fmtR(Number(e.amount)||0)}</td>
          <td><button class="btn ghost small" data-action="delete-spend" data-id="${e.id}">Remove</button></td>
        </tr>`).join('');
      const list = entries.length ? `<table class="spendlist">
          <thead><tr><th>Date</th><th>Description</th><th class="num">Amount</th><th></th></tr></thead>
          <tbody>${rows}</tbody></table>` : `<div class="empty" style="padding:8px 2px;">No actual spend logged yet.</div>`;

      return `<div class="spendbox card" style="padding:16px 18px;">
        <h3>Actual spend</h3>
        ${budgetBar}
        <form class="spendform" data-form="new-spend">
          <label>Description<input type="text" name="description" placeholder="e.g. Vinyl flooring glue, 20L" required></label>
          <label>Amount (R)<input type="number" name="amount" step="0.01" min="0" required></label>
          <label>Date<input type="date" name="date" value="${localISODate()}"></label>
          <button class="btn secondary" type="submit">+ Log</button>
        </form>
        ${list}
      </div>`;
    }

    function jobQuotes(job){
      if (Array.isArray(job.quotes) && job.quotes.length) return job.quotes;
      if (job.quoteNumber) return [{number: job.quoteNumber, date: job.quoteDate||null}];
      return [];
    }

    function quoteLabel(q){
      return q.number ? ('Quote '+q.number+(q.date?' ('+fmtDate(q.date)+')':'')) : '';
    }

    function renderQuoteLineItems(job){
      const items = job.quoteLineItems;
      if (!items || !items.length) return '';
      const quotes = jobQuotes(job);
      const multiQuote = quotes.length > 1;

      function rowsFor(list){
        let lastSection = null;
        return list.map(it=>{
          let sectionRow = '';
          if (it.section && it.section !== lastSection){
            sectionRow = `<tr class="sectionrow"><td colspan="4">${escapeHtml(it.section)}</td></tr>`;
            lastSection = it.section;
          }
          const qty = (it.qty!==null && it.qty!==undefined) ? it.qty : '';
          return `${sectionRow}<tr>
            <td>${escapeHtml(it.description)}${it.note?`<div class="quotenote">${escapeHtml(it.note)}</div>`:''}</td>
            <td class="num mono">${qty}</td>
            <td class="num mono">${fmtR(it.unitPrice)}</td>
            <td class="num mono">${fmtR(it.total)}</td>
          </tr>`;
        }).join('');
      }

      let body;
      if (multiQuote){
        body = quotes.map(q=>{
          const list = items.filter(it=>it.quoteNumber===q.number);
          if (!list.length) return '';
          const subtotal = list.reduce((sum,it)=>sum+(it.total||0),0);
          return `<tr class="sectionrow" style="padding-top:18px;"><td colspan="4" style="color:var(--ink-dim);font-size:12px;">${escapeHtml(quoteLabel(q))}</td></tr>
            ${rowsFor(list)}
            <tr class="totalrow"><td colspan="2"></td><td class="num" style="font-weight:600;">Subtotal</td><td class="num">${fmtR(subtotal)}</td></tr>`;
        }).join('');
      } else {
        body = rowsFor(items);
      }
      const total = items.reduce((sum,it)=>sum + (it.total||0), 0);
      const meta = !multiQuote && quotes[0] ? quoteLabel(quotes[0]) : (multiQuote ? quotes.length+' quotes' : '');
      return `<div class="quotebox card" style="padding:16px 18px;">
        <h3>Quote line items ${meta?`<span class="quotemeta">${escapeHtml(meta)}</span>`:''}</h3>
        <table class="quoteitems">
          <thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Total</th></tr></thead>
          <tbody>${body}<tr class="totalrow"><td colspan="2"></td><td class="num">Total</td><td class="num">${fmtR(total)}</td></tr></tbody>
        </table>
      </div>`;
    }

    function renderJobDetail(state){
      const job = state.currentJob;
      if (!job) return `<div class="empty">Job not found.</div>`;
      const tasks = state.currentJobTasks;
      const crewById = {}; state.crew.forEach(c=>crewById[c.id]=c);
      const schedule = Scheduler.computeSchedule(tasks, crewById, state.settings, job.startDate, jobAllowsWeekendCatchUp(job));
      const s = schedule.error ? null : schedule;

      const summary = s ? `<div class="summarybar">
        <div class="cell"><span>Working days</span><b class="mono">${fmtDays(s.projectFinishDays)}</b></div>
        <div class="cell"><span>Est. completion</span><b class="mono">${fmtDate(s.completionDate)}</b></div>
        <div class="cell"><span>Critical tasks</span><b class="mono">${s.criticalTaskIds.length}</b></div>
        <div class="cell"><span>Bottlenecks</span><b class="mono">${s.bottleneckTaskIds.length}</b></div>
      </div>` : `<div class="banner"><strong>Can't schedule:</strong> ${escapeHtml(schedule.message||'unknown error')}</div>`;

      const rows = tasks.slice().sort((a,b)=>(a.order||0)-(b.order||0)).map(t=>taskRow(t, s||{perTask:{}}, crewById, state.crew)).join('');
      const table = tasks.length ? `<table class="tasks">
        <thead><tr><th>Task</th><th>Start</th><th>Finish</th><th>Duration</th><th>Slack</th><th>Crew</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>` : `<div class="empty">No tasks yet — add the first one below.</div>`;

      const tl = s ? timelineBars(job, tasks, s) : '';
      const isEstate = job.isEstateJob !== false;
      const jobListCategoryOptions = JOB_LIST_CATEGORIES.map(c=>`<option value="${c.key}" ${(job.listCategory||'to_schedule')===c.key?'selected':''}>${c.label}</option>`).join('');
      const jobSettingsBar = `<div class="card" style="padding:9px 14px;margin-bottom:16px;display:flex;gap:20px;flex-wrap:wrap;align-items:center;">
                <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;">Start date <input type="date" data-jobfield="startDate" value="${job.startDate||''}" style="font-size:11px;padding:3px 6px;border-radius:5px;border:1px solid var(--border-strong);background:var(--surface-2);"></label>
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;">List <select data-jobfield="listCategory" style="font-size:11px;padding:3px 6px;border-radius:5px;border:1px solid var(--border-strong);background:var(--surface-2);">${jobListCategoryOptions}</select></label>
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;"><input type="checkbox" data-jobfield="isEstateJob" ${isEstate?'checked':''}> Estate job (no weekend work, ever)</label>
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;${isEstate?'opacity:.45;':''}" title="${isEstate?'Untick the estate flag first — estates never get weekend work.':''}"><input type="checkbox" data-jobfield="saturdayCatchUp" ${job.saturdayCatchUp?'checked':''} ${isEstate?'disabled':''}> Allow Saturday catch-up</label>
      </div>`;

      return `
        <a class="backlink" href="#/jobs">← All jobs</a>
        <div class="jobheader">
          <div class="idbox"><span class="jobcode">${escapeHtml(job.code)}</span><span style="color:var(--ink-dim);">${escapeHtml(job.description||'')}</span></div>
          <span class="pill ${statusPillClass(job.status)}">${escapeHtml(job.status||'No status')}</span>
        </div>
        ${(job.clientName||jobQuotes(job).length) ? `<div class="jobclientline">${job.clientName?escapeHtml(job.clientName):''}${job.clientName&&jobQuotes(job).length?' · ':''}${escapeHtml(jobQuotes(job).map(quoteLabel).join(' & '))}</div>` : ''}
        ${jobSettingsBar}
        ${summary}
        ${taskForm(job, tasks, state.settings.rates.categories, state.crew)}
        ${table}
        ${tl}
        ${renderTimeOnSite(job, state.crew)}
        ${renderActualSpend(job)}
        ${renderQuoteLineItems(job)}
      `;
    }

    function renderSettings(state){
      const cats = state.settings.rates.categories;
      const rateRows = CATEGORY_ORDER.map(key=>{
        const c = cats[key];
        const rateLabel = c.defaultCalcType==='area' ? 'm²/day' : c.defaultCalcType==='unit' ? 'days/unit' : 'calc type: '+c.defaultCalcType;
        const rateVal = c.defaultCalcType==='area' ? c.baseRatePerDay : c.defaultCalcType==='unit' ? c.timePerUnitDays : '';
        const subRows = Object.keys(c.subTypes||{}).map(sk=>{
          const st = c.subTypes[sk];
          return `<tr><td style="padding-left:18px;color:var(--ink-dim);">${escapeHtml(st.label)}</td><td></td>
            <td><input data-rate="multiplier" data-cat="${key}" data-sub="${sk}" type="number" step="0.01" value="${st.multiplier}"></td></tr>`;
        }).join('');
        return `<tr><td><strong>${escapeHtml(c.label)}</strong></td>
          <td class="mono">${rateVal!==''?`<input data-rate="base" data-cat="${key}" data-calctype="${c.defaultCalcType}" type="number" step="0.1" value="${rateVal}"> ${rateLabel}`:rateLabel}</td>
          <td></td></tr>${subRows}`;
      }).join('');

      const curveRows = Object.keys(state.settings.crewRules.efficiencyCurves).map(g=>{
        const curve = state.settings.crewRules.efficiencyCurves[g];
        return `<tr><td>${g}</td>
          <td><input data-curve="${g}" data-n="1" type="number" step="0.01" value="${curve[1]}"></td>
          <td><input data-curve="${g}" data-n="2" type="number" step="0.01" value="${curve[2]}"></td>
          <td><input data-curve="${g}" data-n="3" type="number" step="0.01" value="${curve[3]}"></td></tr>`;
      }).join('');

      const crewRows = state.crew.map(c=>{
        const tags = CATEGORY_ORDER.concat(['general']).map(tag=>{
          const on = (c.tradeTags||[]).includes(tag);
          return `<span class="tagchip ${on?'on':''}" data-action="toggle-tag" data-crew="${c.id}" data-tag="${tag}">${tag}</span>`;
        }).join('');
        const notes = (c.attendanceNotes||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(n=>
          `<span class="crewnote-chip">${fmtDate(n.date)} — ${escapeHtml(n.note)}<span class="x" data-action="delete-crewnote" data-crew="${c.id}" data-id="${n.id}" title="Remove">×</span></span>`
        ).join('');
        return `<div class="crewblock">
          <div class="crewrow">
            <input type="text" value="${escapeHtml(c.name)}" data-action="rename-crew" data-crew="${c.id}">
            <select data-action="role-crew" data-crew="${c.id}">
              <option value="foreman" ${c.role==='foreman'?'selected':''}>Foreman</option>
              <option value="labourer" ${c.role==='labourer'?'selected':''}>Labourer</option>
              <option value="subcontractor" ${c.role==='subcontractor'?'selected':''}>Subcontractor</option>
            </select>
            <label style="display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-dim);white-space:nowrap;" title="Show this person in each job's 'Time on site' log">
              <input type="checkbox" data-action="toggle-logstime" data-crew="${c.id}" ${c.logsTime?'checked':''}> Logs time
            </label>
            <div class="tagcloud">${tags}</div>
            <button class="btn ghost small" data-action="remove-crew" data-crew="${c.id}">Remove</button>
          </div>
          <div class="crewnotes">
            ${notes || `<span class="crewnote-chip" style="background:transparent;padding:0;color:var(--ink-faint);">No absence/schedule notes</span>`}
            <form class="crewnoteform" data-form="new-crewnote" data-crew="${c.id}">
              <input type="date" name="date" value="${localISODate()}">
              <input type="text" name="note" placeholder="e.g. Absent, half day, off Sat" required>
              <button class="btn ghost small" type="submit">+ Note</button>
            </form>
          </div>
        </div>`;
      }).join('');

      return `
        <div class="pagehead"><div><h1>Settings</h1><p>Every rate, curve and buffer the calculator uses — nothing here is fixed in code.</p></div></div>

        <div class="settings-section card" style="padding:16px 18px;">
          <h2>Working hours & calendar</h2>
          <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;">
            <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-dim);">Day start
              <input data-cal="dayStart" value="${state.settings.calendar.dayStart}" style="padding:6px 8px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface-2);width:100px;"></label>
            <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-dim);">Day end
              <input data-cal="dayEnd" value="${state.settings.calendar.dayEnd}" style="padding:6px 8px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface-2);width:100px;"></label>
            <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-dim);">Lunch (min)
              <input data-cal="lunchMinutes" type="number" value="${state.settings.calendar.lunchMinutes}" style="padding:6px 8px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface-2);width:80px;"></label>
            <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-dim);">Productive hrs/day
              <input data-cal="productiveHoursPerDay" type="number" step="0.1" value="${state.settings.calendar.productiveHoursPerDay}" style="padding:6px 8px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface-2);width:80px;"></label>
          </div>
          <p style="font-size:11.5px;color:var(--ink-faint);margin-top:8px;">Working days: Mon–Fri by default — Sunday is never worked. Saturday is a per-job "catch-up" toggle, and each job also carries an "Estate job" flag (edit both from the job's page) — when a job is flagged as an estate job, Saturday catch-up is locked off automatically, since estate noise rules ban weekend work outright. Only a confirmed non-estate client (e.g. DRS) should have the estate flag unticked.</p>
        </div>

        <div class="settings-section card" style="padding:16px 18px;">
          <h2>Crew roster</h2>
          <div class="crewlist">${crewRows}</div>
          <button class="btn secondary small" style="margin-top:10px;" data-action="add-crew">+ Add crew member</button>
        </div>

        <div class="settings-section card" style="padding:16px 18px;">
          <h2>Crew efficiency curves</h2>
          <table class="rate-table"><thead><tr><th>Group</th><th>1 worker</th><th>2 workers</th><th>3 workers</th></tr></thead>
          <tbody>${curveRows}</tbody></table>
          <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:8px;">Generalist penalty (speed factor)
            <input data-curve="generalistPenalty" type="number" step="0.05" value="${state.settings.crewRules.generalistPenalty}" style="width:70px;padding:5px 7px;border-radius:5px;border:1px solid var(--border-strong);background:var(--surface-2);"></label>
        </div>

        <div class="settings-section card" style="padding:16px 18px;">
          <h2>Categories &amp; rates</h2>
          <table class="rate-table"><thead><tr><th>Category</th><th>Base rate</th><th>Complexity multiplier</th></tr></thead>
          <tbody>${rateRows}</tbody></table>
        </div>
      `;
    }

    function renderShell(state){
      let body;
      if (state.route.name==='jobs') body = (state.showNewJobForm?renderNewJobForm():'') + renderJobsList(state);
      else if (state.route.name==='job') body = renderJobDetail(state);
      else if (state.route.name==='settings') body = renderSettings(state);
      else body = renderJobsList(state);

      const demoBanner = state.dbUnavailable ? `<div class="demo-banner"><strong>Example data</strong> — storage isn't connected in this preview, so nothing you change here is saved.</div>` : '';
      document.getElementById('main').innerHTML = demoBanner + body;
      document.querySelectorAll('#rail nav a').forEach(a=>{
        a.classList.toggle('active', a.dataset.route === (state.route.name==='job'?'jobs':state.route.name));
      });
    }

    return { renderShell };
  })();

  /* =========================================================
     SECTION: Router
     ========================================================= */
  const Router = (function(){
    function parse(){
      const hash = window.location.hash.replace(/^#\/?/, '');
      const parts = hash.split('/').filter(Boolean);
      if (parts[0] === 'jobs' && parts[1]) return { name:'job', id:parts[1] };
      if (parts[0] === 'settings') return { name:'settings' };
      return { name:'jobs' };
    }
    function onChange(cb){ window.addEventListener('hashchange', ()=>cb(parse())); }
    return { parse, onChange };
  })();

  /* =========================================================
     SECTION: App — wiring
     ========================================================= */
  const App = (function(){
    const state = {
      route: Router.parse(),
      jobs: [], crew: [], settings: { calendar: DEFAULT_CALENDAR, rates: DEFAULT_RATES, crewRules: DEFAULT_CREW_RULES },
      currentJob: null, currentJobTasks: [], risks: [],
      showNewJobForm: false, dbUnavailable: false, risksExpanded: false,
    };
    let unsubTasks = null;
    let db = null;

    function render(){ UI.renderShell(state); }

    function loadForRoute(){
      if (unsubTasks){ unsubTasks(); unsubTasks = null; }
      if (state.route.name === 'job'){
        state.currentJob = state.jobs.find(j=>j.id===state.route.id) || null;
        if (db){
          unsubTasks = DataAccess.watchTasks(state.route.id, tasks=>{
            state.currentJobTasks = tasks;
            maybeWriteBackSummary();
            render();
          });
        } else {
          state.currentJobTasks = state.route.id === 'sample-job-1' ? SAMPLE_TASKS : [];
          render();
        }
      } else {
        render();
        if (state.route.name === 'jobs') refreshRisks();
      }
    }

    async function refreshRisks(){
      const crewById = {}; state.crew.forEach(c=>crewById[c.id]=c);
      if (!db){
        const tasksByJob = { 'sample-job-1': SAMPLE_TASKS };
        state.risks = computeRisksList(state.jobs, tasksByJob, crewById, state.settings);
        render();
        return;
      }
      const jobIds = state.jobs.map(j=>j.id);
      if (!jobIds.length){ state.risks = []; render(); return; }
      const tasksByJob = await DataAccess.getAllTasksOnce(jobIds);
      if (state.route.name !== 'jobs') return; // user navigated away while fetching
      state.risks = computeRisksList(state.jobs, tasksByJob, crewById, state.settings);
      render();
    }

    function maybeWriteBackSummary(){
      if (!db || !state.currentJob || !state.currentJobTasks.length) return;
      const crewById = {}; state.crew.forEach(c=>crewById[c.id]=c);
      const sched = Scheduler.computeSchedule(state.currentJobTasks, crewById, state.settings, state.currentJob.startDate, jobAllowsWeekendCatchUp(state.currentJob));
      if (sched.error) return;
      const newSummary = {
        totalWorkingDays: Math.round(sched.projectFinishDays*10)/10,
        estimatedCompletionDate: sched.completionDate,
        criticalTaskCount: sched.criticalTaskIds.length,
        bottleneckCount: sched.bottleneckTaskIds.length,
        computedAt: new Date().toISOString(),
      };
      const cur = state.currentJob.cachedSummary || {};
      const changed = cur.totalWorkingDays !== newSummary.totalWorkingDays || cur.estimatedCompletionDate !== newSummary.estimatedCompletionDate
        || cur.criticalTaskCount !== newSummary.criticalTaskCount || cur.bottleneckCount !== newSummary.bottleneckCount;
      if (changed) DataAccess.saveJob(state.currentJob.id, { cachedSummary: newSummary });
    }

    function bindEvents(){
      window.addEventListener('hashchange', ()=>{ state.route = Router.parse(); state.showNewJobForm=false; loadForRoute(); });

      document.getElementById('main').addEventListener('click', (e)=>{
        const el = e.target.closest('[data-action]');
        if (!el) return;
        const action = el.dataset.action;
        if (action === 'open-job'){ window.location.hash = '#/jobs/'+el.dataset.id; }
        else if (action === 'new-job'){ state.showNewJobForm = true; render(); }
        else if (action === 'cancel-new-job'){ state.showNewJobForm = false; render(); }
        else if (action === 'toggle-risks'){ state.risksExpanded = !state.risksExpanded; render(); }
        else if (action === 'delete-task'){
          if (state.currentJob) DataAccess.deleteTask(state.currentJob.id, el.dataset.id);
        }
        else if (action === 'add-crew'){
          DataAccess.addCrewMember({ name:'New crew member', role:'labourer', tradeTags:['general'] });
        }
        else if (action === 'remove-crew'){ DataAccess.removeCrewMember(el.dataset.crew); }
        else if (action === 'delete-crewnote'){
          const c = state.crew.find(x=>x.id===el.dataset.crew); if(!c) return;
          const remaining = (c.attendanceNotes||[]).filter(n=>n.id!==el.dataset.id);
          DataAccess.saveCrewMember(c.id, { attendanceNotes: remaining });
        }
        else if (action === 'delete-spend'){
          if (!state.currentJob) return;
          const remaining = (state.currentJob.actualSpend||[]).filter(e=>e.id!==el.dataset.id);
          DataAccess.saveJob(state.currentJob.id, { actualSpend: remaining });
        }
        else if (action === 'delete-timeonsite'){
          if (!state.currentJob) return;
          const remaining = (state.currentJob.timeOnSite||[]).filter(e=>e.id!==el.dataset.id);
          DataAccess.saveJob(state.currentJob.id, { timeOnSite: remaining });
        }
        else if (action === 'toggle-tag'){
          const c = state.crew.find(x=>x.id===el.dataset.crew); if(!c) return;
          const tags = new Set(c.tradeTags||[]);
          if (tags.has(el.dataset.tag)) tags.delete(el.dataset.tag); else tags.add(el.dataset.tag);
          DataAccess.saveCrewMember(c.id, { tradeTags:[...tags] });
        }
      });

      document.getElementById('main').addEventListener('change', (e)=>{
        const el = e.target;
        if (el.dataset.action === 'rename-crew'){ DataAccess.saveCrewMember(el.dataset.crew, { name: el.value }); }
        else if (el.dataset.action === 'role-crew'){ DataAccess.saveCrewMember(el.dataset.crew, { role: el.value }); }
        else if (el.dataset.action === 'toggle-logstime'){ DataAccess.saveCrewMember(el.dataset.crew, { logsTime: el.checked }); }
        else if (el.dataset.action === 'toggle-task-crew'){
          if (!state.currentJob) return;
          const task = state.currentJobTasks.find(x=>x.id===el.dataset.taskId);
          if (!task) return;
          const ids = new Set(task.crewIds||[]);
          if (el.checked) ids.add(el.dataset.crewId); else ids.delete(el.dataset.crewId);
          DataAccess.saveTask(state.currentJob.id, task.id, { crewIds: [...ids] });
        }
        else if (el.dataset.action === 'edit-task-duration'){
          if (!state.currentJob) return;
          const task = state.currentJobTasks.find(x=>x.id===el.dataset.taskId);
          if (!task) return;
          const raw = el.value;
          const override = raw === '' ? null : Number(raw);
          DataAccess.saveTask(state.currentJob.id, task.id, { durationOverrideDays: override });
        }
        else if (el.dataset.cal){
          const key = el.dataset.cal;
          const val = (key==='lunchMinutes') ? parseInt(el.value,10) : (key==='productiveHoursPerDay') ? parseFloat(el.value) : el.value;
          DataAccess.saveSettingsDoc('calendar', { [key]: val });
        }
        else if (el.dataset.rate === 'base'){
          const cat = el.dataset.cat, calctype = el.dataset.calctype, val = parseFloat(el.value);
          const rates = JSON.parse(JSON.stringify(state.settings.rates));
          if (calctype==='area') rates.categories[cat].baseRatePerDay = val;
          else if (calctype==='unit') rates.categories[cat].timePerUnitDays = val;
          DataAccess.saveSettingsDoc('rates', { categories: rates.categories });
        }
        else if (el.dataset.rate === 'multiplier'){
          const cat = el.dataset.cat, sub = el.dataset.sub, val = parseFloat(el.value);
          const rates = JSON.parse(JSON.stringify(state.settings.rates));
          rates.categories[cat].subTypes[sub].multiplier = val;
          DataAccess.saveSettingsDoc('rates', { categories: rates.categories });
        }
        else if (el.dataset.curve && el.dataset.n){
          const g = el.dataset.curve, n = el.dataset.n, val = parseFloat(el.value);
          const cr = JSON.parse(JSON.stringify(state.settings.crewRules));
          cr.efficiencyCurves[g][n] = val;
          DataAccess.saveSettingsDoc('crewRules', { efficiencyCurves: cr.efficiencyCurves });
        }
        else if (el.dataset.curve === 'generalistPenalty'){
          DataAccess.saveSettingsDoc('crewRules', { generalistPenalty: parseFloat(el.value) });
        }
        else if (el.dataset.onchange === 'estate-toggle'){
          // New-job form only: estate jobs can't take Saturday work, so lock that
          // checkbox off the moment "Estate job" is ticked.
          const form = el.closest('form');
          const satEl = form && form.querySelector('[name=saturdayCatchUp]');
          if (satEl){ satEl.disabled = el.checked; if (el.checked) satEl.checked = false; }
        }
        else if (el.dataset.jobfield){
          if (!state.currentJob) return;
          const field = el.dataset.jobfield;
                    if (field === 'startDate'){
                      if (!el.value) return; // ignore a cleared date field
                      const patch = { startDate: el.value };
                      const crewById = {}; state.crew.forEach(c=>crewById[c.id]=c);
                      const sched = Scheduler.computeSchedule(state.currentJobTasks, crewById, state.settings, el.value, jobAllowsWeekendCatchUp(state.currentJob));
                      if (!sched.error){
                        patch.cachedSummary = {
                          totalWorkingDays: Math.round(sched.projectFinishDays*10)/10,
                          estimatedCompletionDate: sched.completionDate,
                          criticalTaskCount: sched.criticalTaskIds.length,
                          bottleneckCount: sched.bottleneckTaskIds.length,
                          computedAt: new Date().toISOString(),
                        };
                      }
                      DataAccess.saveJob(state.currentJob.id, patch);
                      return;
                    }
                    if (field === 'listCategory'){
                      DataAccess.saveJob(state.currentJob.id, { listCategory: el.value });
                      return;
                    }
          const patch = { [field]: el.checked };
          if (field === 'isEstateJob' && el.checked) patch.saturdayCatchUp = false; // estate jobs never get weekend work
          DataAccess.saveJob(state.currentJob.id, patch);
        }
      });

      document.getElementById('main').addEventListener('submit', (e)=>{
        e.preventDefault();
        const form = e.target;
        if (form.dataset.form === 'new-job'){
          const fd = new FormData(form);
          const isEstateJob = !!fd.get('isEstateJob');
          const qNum = fd.get('quoteNumber')||'';
          const data = { code: fd.get('code'), description: fd.get('description')||'', status:'🟢 On track',
            clientName: fd.get('clientName')||'', quotes: qNum ? [{number:qNum, date: fd.get('quoteDate')||null}] : [],
            startDate: fd.get('startDate'), isEstateJob, saturdayCatchUp: isEstateJob ? false : !!fd.get('saturdayCatchUp'),
            order: state.jobs.length+1, cachedSummary: {} };
          DataAccess.createJob(data).then(ref=>{ state.showNewJobForm=false; if(ref) window.location.hash = '#/jobs/'+ref.id; else render(); });
        } else if (form.dataset.form === 'new-task'){
          if (!state.currentJob) return;
          const fd = new FormData(form);
          const crewIds = fd.getAll('crewIds');
          const dependsOn = Array.from(form.querySelector('[name=dependsOn]').selectedOptions).map(o=>o.value);
          const data = {
            name: fd.get('name'), category: fd.get('category'), calcType: fd.get('calcType'),
            quantity: fd.get('quantity') ? Number(fd.get('quantity')) : null,
            subType: fd.get('subType') || 'standard',
            blockSizeTier: fd.get('blockSizeTier') || 'small',
            durationOverrideDays: fd.get('durationOverrideDays') ? Number(fd.get('durationOverrideDays')) : null,
            crewIds, dependsOn, notes: fd.get('notes')||'', order: state.currentJobTasks.length+1,
          };
          DataAccess.createTask(state.currentJob.id, data).then(()=>form.reset());
        } else if (form.dataset.form === 'new-spend'){
          if (!state.currentJob) return;
          const fd = new FormData(form);
          const entry = {
            id: 'sp_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
            description: fd.get('description'), amount: Number(fd.get('amount'))||0,
            date: fd.get('date') || localISODate(), addedAt: new Date().toISOString(),
          };
          const updated = (state.currentJob.actualSpend||[]).concat([entry]);
          DataAccess.saveJob(state.currentJob.id, { actualSpend: updated }).then(()=>form.reset());
        } else if (form.dataset.form === 'new-timeonsite'){
          if (!state.currentJob) return;
          const fd = new FormData(form);
          const date = fd.get('date') || localISODate();
          const checkedIds = fd.getAll('crew');
          const newEntries = checkedIds.map(crewId=>({
            id: 'to_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'_'+crewId,
            crewId, date, days: Number(fd.get('days_'+crewId))||0,
            addedAt: new Date().toISOString(),
          })).filter(e=>e.days>0);
          if (!newEntries.length) return;
          const updated = (state.currentJob.timeOnSite||[]).concat(newEntries);
          DataAccess.saveJob(state.currentJob.id, { timeOnSite: updated }).then(()=>form.reset());
        } else if (form.dataset.form === 'new-crewnote'){
          const c = state.crew.find(x=>x.id===form.dataset.crew); if(!c) return;
          const fd = new FormData(form);
          const entry = {
            id: 'cn_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
            date: fd.get('date') || localISODate(), note: fd.get('note'), addedAt: new Date().toISOString(),
          };
          const updated = (c.attendanceNotes||[]).concat([entry]);
          DataAccess.saveCrewMember(c.id, { attendanceNotes: updated }).then(()=>form.reset());
        }
      });
    }

    async function init(){
      document.getElementById('shell').outerHTML = '<div id="shell"><aside id="rail"><div class="brand"><span class="mark">Site Sequence</span></div><nav id="nav"><a href="#/jobs" data-route="jobs">Jobs</a><a href="#/settings" data-route="settings">Settings</a></nav><div class="foot">Working day 08:30-16:00<br>7 productive hrs - Mon-Fri<br><a href="#" id="logout-link" style="color:inherit;">Log out</a></div></aside><main id="main"><div class="empty">Loading...</div></main></div>';
      bindEvents();
      var logoutLink=document.getElementById('logout-link'); if (logoutLink) logoutLink.addEventListener('click', function(ev){ ev.preventDefault(); firebase.auth().signOut(); });
      db = await DataAccess.getDb();
      if (!db){
        state.dbUnavailable = true;
        state.jobs = SAMPLE_JOBS; state.crew = SAMPLE_CREW;
        loadForRoute();
        return;
      }
      await DataAccess.maybeImportSeedData();
      await DataAccess.ensureSeeded();
      DataAccess.watchSettings(settings=>{ state.settings = settings; render(); if(state.route.name==='job') maybeWriteBackSummary(); });
      DataAccess.watchCrew(crew=>{ state.crew = crew; render(); });
      DataAccess.watchJobs(jobs=>{ state.jobs = jobs; if(state.route.name==='job'){ state.currentJob = jobs.find(j=>j.id===state.route.id)||state.currentJob; } render(); if(state.route.name==='jobs') refreshRisks(); });
      loadForRoute();
    }

    Router.onChange(r=>{ state.route=r; loadForRoute(); });
    return { init };
  })();

  var appStarted=false; function bootAuthGate(){ if (!FIREBASE_CONFIGURED || typeof firebase==='undefined'){ renderSetupNotice(); return; } try{ if (!firebase.apps.length) firebase.initializeApp(firebaseConfig); }catch(e){ renderSetupNotice(); return; } firebase.auth().onAuthStateChanged(function(user){ if (user && user.isAnonymous){ firebase.auth().signOut(); return; } if (user){ if (!appStarted){ appStarted=true; App.init(); } } else { appStarted=false; renderLoginScreen(); } }); } if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',bootAuthGate);}else{bootAuthGate();}
})();
</script>
</body></html>
